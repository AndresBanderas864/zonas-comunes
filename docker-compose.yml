services:
  mariadb:
    image: mariadb:11
    container_name: ecc-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ecc
      MARIADB_USER: ecc
      MARIADB_PASSWORD: ecc
    ports:
      - "3306:3306"
    volumes:
      - ecc-datos:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ecc-datos:
